name: Test Formula

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        run: |
          brew update

      - name: Validate formula syntax
        run: |
          # Use Ruby to validate the formula syntax
          ruby -c Formula/mental-note.rb

      - name: Set up tap
        run: |
          # Create a local tap from this repository
          REPO_PATH="${GITHUB_WORKSPACE}"
          TAP_PATH="$(brew --repository)/Library/Taps/test"
          mkdir -p "$TAP_PATH"
          ln -s "$REPO_PATH" "$TAP_PATH/homebrew-mental-note"

      - name: Test formula installation
        run: |
          # Install from the local tap
          brew install --build-from-source test/mental-note/mental-note

      - name: Test binary execution
        run: |
          mental-note --version
          mn --version
          mental-note version

      - name: Run formula tests
        run: |
          brew test mental-note

      - name: Test basic functionality
        run: |
          mn add do "Test task"
          mn list
          mn delete 1 --confirm

      - name: Cleanup
        if: always()
        run: |
          brew uninstall mental-note || true
